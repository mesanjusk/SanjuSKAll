services:
  - type: web
    name: sk-ship-platform
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: MONGODB_DB
        value: sk_ship
      - key: SESSION_SECRET
        generateValue: true
