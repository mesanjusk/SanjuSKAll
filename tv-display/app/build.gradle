plugins { id 'com.android.application' }

android {
    namespace 'in.sanjusk.tvdisplay'
    compileSdk 35
    defaultConfig {
        applicationId 'in.sanjusk.tvdisplay'
        minSdk 23
        targetSdk 28
        versionCode 3
        versionName '1.2.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
