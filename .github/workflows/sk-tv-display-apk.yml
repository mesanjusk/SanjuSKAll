name: SK Digital TV Display APK

on:
  push:
    branches:
      - main
      - feature/sk-tv-signage-mobile
    paths:
      - 'tv-display/**'
      - '.github/workflows/sk-tv-display-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile debug APK
        run: gradle -p tv-display :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SK-Digital-TV-Display-APK
          path: tv-display/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
